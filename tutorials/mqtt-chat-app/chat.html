<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MQTT Chat</title>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 1.5rem auto; padding: 0 1rem; }
    .layout { display: grid; grid-template-columns: 1fr 200px; gap: 1rem; }
    #messages { border: 1px solid #ccc; height: 360px; overflow-y: auto; padding: .5rem; }
    #users { border: 1px solid #ccc; padding: .5rem; list-style: none; margin: 0; }
    .me { color: #0a58ca; }
    .meta { color: #777; font-size: .8rem; }
    form { display: flex; gap: .5rem; margin-top: .5rem; }
    form input[type=text] { flex: 1; }
    input, button { font: inherit; padding: .4rem .6rem; }
  </style>
</head>
<body>
  <h1>MQTT Chat</h1>
  <form id="joinForm">
    <input type="text" id="name" placeholder="Your name" required maxlength="24">
    <input type="text" id="room" value="general" required maxlength="24">
    <button>Join</button>
  </form>
  <div class="layout">
    <div>
      <div id="messages"></div>
      <form id="sendForm">
        <input type="text" id="text" placeholder="Type a message" maxlength="500" autocomplete="off">
        <button>Send</button>
      </form>
    </div>
    <ul id="users"></ul>
  </div>

  <script>
    // Change this to your own random string, shared by everyone who should see the chat.
    const PREFIX = "connectmq/demo/chat-k7f3q2";
    const URL = "wss://broker.connectmq.com:8084/mqtt";

    const clientId = "chat-" + Math.random().toString(16).slice(2, 10);
    const messagesEl = document.getElementById("messages");
    const usersEl = document.getElementById("users");
    const users = new Map();
    let client = null, me = null, topics = null;

    function addMessage(from, text, ts, mine) {
      const div = document.createElement("div");
      const who = document.createElement("strong");
      who.textContent = from + ": ";
      if (mine) who.className = "me";
      const body = document.createElement("span");
      body.textContent = text;                       // never innerHTML: payloads are untrusted
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = "  " + new Date(ts).toLocaleTimeString();
      div.append(who, body, meta);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderUsers() {
      usersEl.replaceChildren();
      for (const [id, u] of users) {
        if (u.status !== "online") continue;
        const li = document.createElement("li");
        li.textContent = u.name + (id === clientId ? " (you)" : "");
        usersEl.appendChild(li);
      }
    }

    function presence(status) {
      return JSON.stringify({ name: me, status, ts: Date.now() });
    }

    document.getElementById("joinForm").onsubmit = (e) => {
      e.preventDefault();
      if (client) return;
      me = document.getElementById("name").value.trim();
      const room = document.getElementById("room").value.trim().replace(/[#+\/]/g, "");
      const base = `${PREFIX}/room/${room}`;
      topics = {
        messages: `${base}/messages`,
        presenceAll: `${base}/presence/+`,
        presenceMe: `${base}/presence/${clientId}`
      };

      client = mqtt.connect(URL, {
        clientId,
        protocolVersion: 5,
        clean: true,
        keepalive: 20,
        reconnectPeriod: 3000,
        will: {
          topic: topics.presenceMe,
          payload: presence("offline"),
          qos: 1,
          retain: true
        }
        // Private broker: username: "YOUR_USERNAME", password: "YOUR_PASSWORD"
      });

      client.on("connect", () => {
        client.subscribe({
          [topics.messages]: { qos: 1, nl: true },     // No Local: skip my own messages
          [topics.presenceAll]: { qos: 1 }
        });
        client.publish(topics.presenceMe, presence("online"), { qos: 1, retain: true });
        addMessage("system", `Joined room "${room}" as ${me}`, Date.now(), false);
      });

      client.on("message", (topic, payload) => {
        const presencePrefix = topics.presenceAll.slice(0, -1);
        if (topic.startsWith(presencePrefix) && payload.length === 0) {
          users.delete(topic.split("/").pop());       // retained presence was cleared
          return renderUsers();
        }
        let data;
        try { data = JSON.parse(payload.toString()); } catch { return; }
        if (topic === topics.messages) {
          addMessage(String(data.from), String(data.text), data.ts, false);
        } else if (topic.startsWith(presencePrefix)) {
          const id = topic.split("/").pop();
          users.set(id, { name: String(data.name), status: data.status });
          renderUsers();
        }
      });

      client.on("error", (err) => addMessage("system", "Error: " + err.message, Date.now(), false));
    };

    document.getElementById("sendForm").onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById("text");
      const text = input.value.trim();
      if (!client || !client.connected || !text) return;
      const msg = { from: me, text, ts: Date.now() };
      client.publish(topics.messages, JSON.stringify(msg), { qos: 1 });
      addMessage(me, text, msg.ts, true);             // render locally right away
      input.value = "";
    };

    window.addEventListener("beforeunload", () => {
      if (client && client.connected) {
        // Clean exit: clear my retained presence instead of leaving "offline" behind.
        client.publish(topics.presenceMe, "", { qos: 0, retain: true });
        client.end(true);
      }
    });
  </script>
</body>
</html>
